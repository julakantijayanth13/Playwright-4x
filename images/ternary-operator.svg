<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title description">
  <title id="title">Ternary operator decision flow</title>
  <desc id="description">A condition selects either the value after the question mark or the value after the colon.</desc>
  <rect width="900" height="360" rx="24" fill="#101827"/>
  <text x="450" y="54" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Ternary operator</text>
  <rect x="308" y="82" width="284" height="72" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="450" y="126" fill="#e2e8f0" font-family="monospace" font-size="23" text-anchor="middle">age &gt; 18 ? true : false</text>
  <path d="M450 154v31M450 185H235v28M450 185h215v28" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <path d="m227 205 8 10 8-10M657 205l8 10 8-10" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <text x="235" y="208" fill="#86efac" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">condition is true</text>
  <text x="665" y="208" fill="#fda4af" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">condition is false</text>
  <rect x="135" y="230" width="200" height="72" rx="14" fill="#14532d"/>
  <text x="235" y="273" fill="#dcfce7" font-family="monospace" font-size="24" text-anchor="middle">returns true</text>
  <rect x="565" y="230" width="200" height="72" rx="14" fill="#881337"/>
  <text x="665" y="273" fill="#ffe4e6" font-family="monospace" font-size="24" text-anchor="middle">returns false</text>
</svg>
